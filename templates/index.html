<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="entete">
    <a class="logo" href="/">Pokédex</a>
  </header>

  <main class="page">
    <form class="recherche" action="/">
      <input type="text" name="q" placeholder="Nom du Pokémon" value="{{.Recherche}}">
      <button>Rechercher</button>
    </form>

    <nav class="filtres">
      <a class="type" href="/">Tous</a>
      {{range .Types}}
        <a class="type {{.}}" href="/?type={{.}}">{{.}}</a>
      {{end}}
    </nav>

    <p class="compteur">
      {{len .Pokemons}} Pokémon
      {{if .Type}}de type {{.Type}}{{end}}
    </p>

    <div class="grille">
      {{range .Pokemons}}
        <a class="carte" href="/pokemon/{{.ID}}">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/{{.ID}}.png" alt="{{.Name}}">
          <p class="numero">n° {{printf "%03d" .ID}}</p>
          <h2>{{.Name}}</h2>
        </a>
      {{else}}
        <p>Aucun Pokémon trouvé.</p>
      {{end}}
    </div>
  </main>
</body>
</html>
